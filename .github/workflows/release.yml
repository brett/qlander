# Builds and publishes a release for a pushed tag vX.Y.Z (docs/deployment.md
# §6.1): the bundle qlander-X.Y.Z.js, qlander.schema.json and
# SHA256SUMS, from scripts/build-release.ts, which refuses a tag that is not
# v<package.json version>.
#
# A control repo pins one release in .github/qlander-release.txt
# ("<version> <asset> <sha256>"); the tick checks that sha256 before it runs
# the bundle, so the checksum committed there is the trust root, not this
# workflow. The build is deterministic: rebuild from the tag with the pinned
# Bun and compare.
#
# A build-provenance attestation is added when the repo is public. GitHub
# offers attestations for private repos on Enterprise Cloud only, so a
# private repo's release has the checksums alone.
#
# The public repo's copy (this file) also scrubs the tag name, the tag
# annotation, the notes, the tagged tree and the built assets before anything is published; it
# reads the scrub rules from a secret, and that is its only secret. The tag is
# already public by then, so the maintainer's pre-push hook checks it first
# (docs/deployment.md §7).
#
# GitHub-hosted, no environment, no cache and no package install,
# and never the self-hosted qlander pools. Bun is the pinned release in
# .github/bun-release.txt, checked against its sha256.

name: release

on:
  push:
    tags: ["v*"]

permissions: {}

jobs:
  release:
    name: Build and publish the release
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    permissions:
      contents: write # create the release and upload its assets
      id-token: write # sign the provenance attestation (public repos)
      attestations: write # store the provenance attestation (public repos)
    steps:
      - name: Check out the tag
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Refuse a tag that is not on main
        # Only reviewed code is built, and only main's scrub script sees the rules secret.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          status="$(gh api "repos/$GH_REPO/compare/main...$TAG_COMMIT" --jq .status)"
          if [ "$status" != identical ] && [ "$status" != behind ]; then
            echo "::error::the tag's commit is not on main ($status)"
            exit 1
          fi

      - name: Build the assets
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          read -r version asset sum < .github/bun-release.txt
          dir="$(mktemp -d)"
          curl --fail --silent --show-error --location --proto '=https' --tlsv1.2 --retry 5 --retry-all-errors --retry-max-time 60 --connect-timeout 10 --max-time 120 \
            --output "$dir/$asset" "https://github.com/oven-sh/bun/releases/download/bun-v${version}/${asset}"
          (cd "$dir" && echo "${sum}  ${asset}" | sha256sum -c -)
          unzip -q "$dir/$asset" -d "$dir"
          "$dir/${asset%.zip}/bun" scripts/build-release.ts --out dist --tag "$TAG"
          echo "$dir/${asset%.zip}/bun" > "$RUNNER_TEMP/bun-path" # for any later step that runs a script
          (cd dist && sha256sum -c SHA256SUMS)

      - name: Refuse a stale template pin
        # docs/deployment.md §6.2: a template that pins any other sum refuses this
        # release, so it can't ship. This job's Bun is the pinned one.
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          built="${TAG#v} qlander-${TAG#v}.js $(sha256sum "dist/qlander-${TAG#v}.js" | cut -d' ' -f1)"
          pinned="$(cat template/.github/qlander-release.txt)"
          if [ "$pinned" != "$built" ]; then
            echo "::error::template/.github/qlander-release.txt says '$pinned'; this tag builds '$built'"
            exit 1
          fi

      - name: Write the release notes
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          pin="${TAG#v} qlander-${TAG#v}.js $(sha256sum "dist/qlander-${TAG#v}.js" | cut -d' ' -f1)"
          printf 'Built from %s.\n\nPin line for .github/qlander-release.txt:\n\n    %s\n' "$GITHUB_SHA" "$pin" > "$RUNNER_TEMP/notes.md"

      - name: Scrub the tag (name, annotation, tagger), the release notes, the tree and the assets
        # docs/deployment.md §7: nothing is published or attested until these scan clean.
        # The rules come from the PUBLIC_SCRUB_RULES secret; without it the scrub
        # exits 2 and the release is refused.
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          TAG_OBJECT: ${{ github.event.after }}
          TAG_COMMIT: ${{ github.sha }}
          SERVER: ${{ github.server_url }}
          PUBLIC_SCRUB_RULES: ${{ secrets.PUBLIC_SCRUB_RULES }}
        run: |
          set -euo pipefail
          t="$RUNNER_TEMP/scrub"
          mkdir -p "$t"
          printf '%s\n' "$TAG" > "$t/tag-name"
          # The tag object this run was started for, never whatever the tag names now.
          # The job's token as a header in git's environment config (a private repo
          # needs it), never on a command line or in .git/config.
          auth="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          echo "::add-mask::$auth"
          GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0="http.$SERVER/.extraheader" GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth" \
            git fetch --quiet --no-tags "$SERVER/$GH_REPO.git" "+refs/tags/$TAG:refs/scrub/tag"
          if [ "$(git rev-parse refs/scrub/tag)" != "$TAG_OBJECT" ]; then
            echo "::error::the tag moved after this run started"
            exit 1
          fi
          "$(cat "$RUNNER_TEMP/bun-path")" scripts/public-scrub.ts --fail --redact \
            --tag refs/scrub/tag --text "$t/tag-name" --text "$RUNNER_TEMP/notes.md" --tree "$TAG_COMMIT" --forbid-excluded --tree dist

      - name: Attest build provenance
        if: ${{ !github.event.repository.private }}
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/qlander-*.js

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          gh release create "$TAG" --verify-tag --title "$TAG" --notes-file "$RUNNER_TEMP/notes.md" \
            "dist/qlander-${TAG#v}.js" dist/qlander.schema.json dist/SHA256SUMS
