# CI for every pull request: tests, typecheck and the workflow linters. No
# secrets, no environments, no write permissions, GitHub-hosted runners only.
# The scrub check is its own workflow (scrub.yml), because it needs a secret
# and so runs on pull_request_target.

name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: bun test and tsc
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.2
          no-cache: true # this job must never write a cache another workflow could read
      - run: bun install --frozen-lockfile
      # This repo has no qlander.yml, so the suite runs on the neutral
      # example config (test/preload.ts).
      - run: bun test
      - run: bunx tsc --noEmit

  workflows:
    name: zizmor and actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          enable-cache: false
      - name: zizmor
        run: uvx zizmor@1.30.1 --pedantic --offline .github/workflows template/.github/workflows
      - name: actionlint
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
      - name: actionlint (the template repo's workflows)
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 template/.github/workflows/*.yml

  # The NixOS module's checks, VM tests included (nixos/checks.nix).
  # Offline but for the pinned nixpkgs and Bun downloads.
  nixos:
    name: NixOS module and VM tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          extra_nix_config: |
            system-features = kvm nixos-test benchmark big-parallel
      # Hosted runners have /dev/kvm, but only root may open it until this rule applies.
      - name: Open /dev/kvm to the build users
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: nix flake check -L --no-update-lock-file
